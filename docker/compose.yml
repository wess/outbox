services:
  postgres:
    image: postgres:17-alpine
    container_name: outbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - "55432:5432"
    volumes:
      - outbox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outbox-pgdata:
