name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one deployment at a time; let an in-flight run finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Exposes base_path and origin, which differ between a project site
      # (served from /<repo>) and a user or custom-domain site (served from /).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on and points it at Actions, so a fresh clone or fork
          # deploys without anyone visiting the settings screen first.
          enablement: true

      - name: Build site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          # GitHub reports an http:// origin when it did not issue the
          # certificate itself — which is what happens with a custom domain that
          # terminates TLS at a proxy. The site is served over https either way,
          # so canonical and llms.txt URLs have to say https or they point at a
          # redirect.
          export SITE_URL="${PAGES_ORIGIN/#http:/https:}${PAGES_BASE}"
          echo "building for $SITE_URL"
          bun run site/build.ts --base "$PAGES_BASE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
